<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- KIAS Product Placeholder -->
  <defs>
    <style>
      .placeholder-bg {
        fill: #f8f9fa;
      }
      .placeholder-border {
        stroke: #e9ecef;
        stroke-width: 2;
        fill: none;
      }
      .placeholder-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        fill: #6c757d;
      }
      .brand-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        fill: #000000;
      }
      .vietnamese-text {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        fill: #495057;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" class="placeholder-bg"/>
  <rect x="1" y="1" width="398" height="398" class="placeholder-border"/>
  
  <!-- KIAS Brand Logo Area -->
  <rect x="50" y="50" width="300" height="100" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- KIAS Brand Text -->
  <text x="200" y="85" text-anchor="middle" class="brand-text" font-size="24">
    KIAS
  </text>
  <text x="200" y="105" text-anchor="middle" class="vietnamese-text" font-size="12">
    x HannahOlala
  </text>
  <text x="200" y="125" text-anchor="middle" class="vietnamese-text" font-size="10">
    Premium Fashion Collection
  </text>
  
  <!-- Product Image Area -->
  <rect x="75" y="170" width="250" height="150" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  
  <!-- Fashion Icon -->
  <g transform="translate(175, 220)">
    <!-- Handbag Icon -->
    <path d="M20 10 L30 10 L28 35 L12 35 Z" fill="#dee2e6"/>
    <path d="M15 10 L15 5 C15 2 17 0 20 0 C23 0 25 2 25 5 L25 10" stroke="#adb5bd" stroke-width="2" fill="none"/>
    <circle cx="18" cy="20" r="1" fill="#6c757d"/>
    <circle cx="22" cy="20" r="1" fill="#6c757d"/>
  </g>
  
  <!-- Vietnamese Product Name Area -->
  <rect x="50" y="340" width="300" height="40" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="200" y="355" text-anchor="middle" class="vietnamese-text" font-size="11">
    Sản phẩm thời trang cao cấp
  </text>
  <text x="200" y="370" text-anchor="middle" class="vietnamese-text" font-size="9">
    Premium Vietnamese Fashion
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="80" cy="80" r="3" fill="#e9ecef"/>
  <circle cx="320" cy="80" r="3" fill="#e9ecef"/>
  <circle cx="80" cy="320" r="3" fill="#e9ecef"/>
  <circle cx="320" cy="320" r="3" fill="#e9ecef"/>
</svg>
