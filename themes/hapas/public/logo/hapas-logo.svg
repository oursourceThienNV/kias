<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- HAPAS Logo - Minimalist Design -->
  <defs>
    <style>
      .logo-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        letter-spacing: -0.05em;
      }
      .tagline-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 300;
        font-style: italic;
      }
    </style>
  </defs>
  
  <!-- Main Brand Name -->
  <text x="60" y="20" text-anchor="middle" class="logo-text" font-size="18" fill="#000000">
    HAPAS
  </text>
  
  <!-- Tagline -->
  <text x="60" y="32" text-anchor="middle" class="tagline-text" font-size="8" fill="#666666">
    Điều bình thường tươi đẹp
  </text>
  
  <!-- Decorative Element -->
  <circle cx="10" cy="20" r="2" fill="#000000" opacity="0.3"/>
  <circle cx="110" cy="20" r="2" fill="#000000" opacity="0.3"/>
</svg>
